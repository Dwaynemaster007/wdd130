<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML and CSS Web Fundamentals Quiz</title>
    <link rel="stylesheet" href="styles/quiz.css">
</head>

<body>
    <header>
        <h1>HTML &amp; CSS Web Fundamentals Quiz</h1>
    </header>

    <main>
        <form action="#" method="post">

            <div class="form-group">
                <label for="q1">1. What does HTML stand for?</label>
                <input type="text" id="q1" name="q1" required placeholder="Type your answer here">
            </div>

            <div class="form-group">
                <label for="q2">2. Briefly explain the purpose of the CSS box model:</label>
                <textarea id="q2" name="q2" rows="4" required
                  placeholder="Write a brief description..."></textarea>
            </div>

            <div class="form-group">
                <label for="q3">3. Which CSS framework layout rule utilizes parent columns and
                    rows?</label>
                <select id="q3" name="q3" required>
                    <option value="" selected disabled>Choose One ...</option>
                    <option value="flexbox">Flexbox</option>
                    <option value="grid">CSS Grid</option>
                    <option value="absolute">Absolute Positioning</option>
                </select>
            </div>

            <div class="form-group">
                <label for="q4">4. How many levels of headings (h1 through hX) exist natively in
                    HTML?</label>
                <input type="number" id="q4" name="q4" required min="1" max="10"
                  placeholder="e.g. 1">
            </div>

            <div class="form-actions">
                <button type="submit">Submit Quiz</button>
            </div>

        </form>
    </main>

    <footer>
        <p>&copy; 2026 | WDD 130 Web Fundamentals | Quiz Code-along</p>
    </footer>
</body>

</html>
